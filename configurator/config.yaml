---
version: 6.0.0
slug: configurator
name: File editor
description: Simple browser-based file editor for Muthur Command
url: https://github.com/muthur-command/addons/tree/mc/configurator
arch:
  - aarch64
  - amd64
muthurcommand: 0.91.1
muthurcommand_api: true
image: muthur-command/{arch}-addon-configurator
ingress: true
init: false
map:
  - all_addon_configs:rw
  - backup:rw
  - config:rw
  - media:rw
  - share:rw
  - ssl:rw
options:
  dirsfirst: false
  enforce_basepath: true
  git: true
  ignore_pattern:
    - __pycache__
    - .cloud
    - .storage
    - deps
  ssh_keys: []
panel_icon: mdi:wrench
schema:
  dirsfirst: bool
  enforce_basepath: bool
  git: bool
  ignore_pattern:
    - str
  ssh_keys:
    - str
