---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    # addons builder.yml uses home-assistant/builder (legacy addon CI), not
    # muthur-command/builder/actions/* (multi-arch image builds).
    ignore:
      - dependency-name: "muthur-command/builder"
