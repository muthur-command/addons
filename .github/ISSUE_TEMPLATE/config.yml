---
# yamllint disable rule:line-length
blank_issues_enabled: false
contact_links:
  - name: Report a bug with the UI or Frontend
    url: https://github.com/muthur-command/mc-fd/issues
    about: Report issues with the Muthur Command frontend in the mc-fd repository.
  - name: Report a bug with Muthur Command Core
    url: https://github.com/muthur-command/mc_bd/issues
    about: Report issues with the core platform in the mc_bd repository.
  - name: Report incorrect or missing documentation
    url: https://github.com/muthur-command/docs/issues
    about: Documentation issues are tracked in the docs repository.
  - name: I have a question or need support
    url: https://www.muthur-command.com
    about: Visit muthur-command.com for help resources.
  - name: Feature Request
    url: https://github.com/muthur-command/addons/discussions
    about: Please use GitHub Discussions for feature requests.
  - name: I'm unsure where to go
    url: https://www.muthur-command.com
    about: If you are unsure where to go, visit muthur-command.com.
