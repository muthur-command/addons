---
version: 10.1.0
slug: ssh
name: Terminal & SSH
description: Allow logging in remotely to Muthur Command using SSH
url: https://github.com/muthur-command/addons/tree/mc/ssh
arch:
  - aarch64
  - amd64
audio: true
mcos_api: true
mcos_role: manager
host_dbus: true
image: muthur-command/{arch}-addon-ssh
ingress: true
init: false
map:
  - addons:rw
  - all_addon_configs:rw
  - backup:rw
  - config:rw
  - media:rw
  - share:rw
  - ssl:rw
options:
  authorized_keys: []
  password: ""
  apks: []
  server:
    tcp_forwarding: false
panel_icon: mdi:console
panel_title: Terminal
ports:
  22/tcp: null
schema:
  authorized_keys:
    - str
  password: password
  apks:
    - str
  server:
    tcp_forwarding: bool
startup: services
uart: true
