---
version: 0.4.0
slug: silabs_flasher
name: Silicon Labs Flasher
description: Silicon Labs firmware flasher add-on
url: >
  https://github.com/muthur-command/addons/tree/mc/silabs_flasher
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
gpio: true
mcos_api: true
image: muthur-command/{arch}-addon-silabs-flasher
init: false
options:
  device: null
  bootloader_baudrate: "115200"
  flow_control: true
  verbose: false
schema:
  device: device(subsystem=tty)?
  bootloader_baudrate: list(57600|115200|230400|460800|921600)
  ezsp_baudrate: int?
  flow_control: bool?
  firmware_url: str?
  verbose: bool?
stage: experimental
startup: once
boot: manual
